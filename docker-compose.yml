services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unre_hr
      POSTGRES_USER: unre
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - unre-postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unre -d unre_hr"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  unre-postgres:
